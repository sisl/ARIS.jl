# Documentation site for ARIS.jl. Build: pip install zensical && zensical build --strict
[project]
site_name = "ARIS.jl"
site_description = "Amortized Rare-Event Importance Sampling: one proposal, reused across failure thresholds"
site_author = "SISL"
site_url = "https://sisl.github.io/ARIS.jl/"
edit_uri = ""
copyright = "MIT. Derived code and pinned dependencies are recorded in NOTICE."
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Quickstart" = "quickstart.md" },
    { "Installation" = "install.md" },
  ] },
  { "Concepts" = [
    { "Rare-event estimation" = "rare-events.md" },
    { "Amortized importance sampling" = "amortization.md" },
    { "Methodology" = "methodology.md" },
  ] },
  { "Guides" = [
    { "Defining a system" = "defining-a-system.md" },
    { "Training a proposal" = "training.md" },
    { "Estimating failure probabilities" = "estimating.md" },
    { "Working with multiple thresholds" = "multiple-thresholds.md" },
  ] },
  { "Examples" = [
    { "Basic usage" = "basic-usage.md" },
    { "Example problems" = "problems.md" },
  ] },
  { "API reference" = [
    { "Systems and interfaces" = "api-systems.md" },
    { "Models and distributions" = "api-models.md" },
    { "Training and sampling" = "api-training.md" },
    { "Estimators and baselines" = "api-estimators.md" },
  ] },
  { "Research" = [
    { "Paper and method" = "paper.md" },
    { "Reproducing experiments" = "reproduce.md" },
    { "Citation" = "citation.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/aris-mark.svg"
favicon = "assets/favicon.ico"
font = false                      # system fonts: no third-party font requests
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "white"
accent = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji = { emoji_index = "zensical.extensions.emoji.twemoji", emoji_generator = "zensical.extensions.emoji.to_svg" }  # theme icons, e.g. :simple-github:
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
